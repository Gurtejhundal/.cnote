name: Build VSIX

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnote-vsix-main
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate extension icon
        run: python scripts/generate_icon.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile
        run: npm run compile

      - name: Check generated webview scripts
        run: node scripts/check-webviews.cjs

      - name: Check inline note parsing
        run: node scripts/check-inline-notes.cjs

      - name: Check Snap capture logic
        run: node scripts/check-snap-capture.cjs

      - name: Check typing shortcuts
        run: node scripts/check-shortcuts.cjs

      - name: Read package version
        shell: bash
        run: |
          CN_VERSION=$(node -p "require('./package.json').version")
          echo "CN_VERSION=$CN_VERSION" >> "$GITHUB_ENV"

      - name: Package VSIX
        run: |
          mkdir -p downloads
          cp README.md /tmp/README.github.md
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')

          # VS Marketplace strips/blocks SVG images in extension READMEs, so
          # keep only raster assets inside the packaged listing.
          text = re.sub(r'<img\b[^>]*\.svg[^>]*>', '', text, flags=re.I)

          # Always show the packaged version in Marketplace even when the
          # repository README still points at the previous direct-download file.
          version = os.environ.get('CN_VERSION', '').strip()
          if version:
              text = re.sub(r'6\.3\.0', version, text)

          old_support = '<p align="center"><b>UPI support QR is available in the GitHub repo.</b><br><sub>Gurtejbir Singh · A GitHub star is love, too.</sub></p>'
          new_support = '''<p align="center">
            <img src="media/readme/crying-waterfall.png" alt="Crying face for the very serious PS5 side quest" width="110"><br>
            <b>help me buy a PS5 😭🎮</b><br>
            <sub>the extension is free. my console fund is fighting for its life.</sub>
          </p>

          <p align="center">
            <img src="media/readme/upi-qr.png" alt="UPI payment QR for Gurtejbir Singh" width="220"><br>
            <b>Scan with any UPI app</b><br>
            <sub>Gurtejbir Singh · UPI: gurtejbir.29107@okhdfcbank · totally optional 💚</sub>
          </p>'''

          if old_support in text:
              text = text.replace(old_support, new_support)
          else:
              text += '\n\n' + new_support + '\n'

          p.write_text(text, encoding='utf-8')
          PY
          npx vsce package -o "downloads/codenote-${CN_VERSION}.vsix"
          cp /tmp/README.github.md README.md

      - name: Publish installable VSIX and icon to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- README.md package-lock.json 2>/dev/null || true
          git add -f "downloads/codenote-${CN_VERSION}.vsix" media/cnote-icon.png
          if git diff --cached --quiet; then
            echo "Release assets unchanged"
          else
            git commit -m "Build .cnote ${CN_VERSION} release assets"
            git push
          fi
