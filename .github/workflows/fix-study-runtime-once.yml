name: Fix Study runtime once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-study-runtime-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch Study runtime
        run: python scripts/repair-study-runtime.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile
        run: npm run compile

      - name: Run regression suite
        run: npm test

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # repair-study-runtime.py intentionally edits build-vsix locally so the
          # new smoke test is exercised in this job, but this Actions token is
          # not allowed to push workflow-file changes. Restore that file before
          # committing/rebasing; we update it separately through the repo API.
          git restore .github/workflows/build-vsix.yml
          git add src/studyPreview.ts scripts/check-study-webview.cjs package.json package-lock.json README.md CHANGELOG.md
          git commit -m "Fix Study cell runtime and shortcuts in 7.1.7"
          git pull --rebase origin main
          git push
