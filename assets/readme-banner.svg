<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label=".cnote — your comments got an upgrade"><rect width="1200" height="420" rx="18" fill="#0b0d10"/><g font-family="Arial,Helvetica,sans-serif"><text x="58" y="64" fill="#c7ff45" font-size="28" font-weight="700">&lt;·&gt; .cnote</text><text x="1140" y="59" text-anchor="end" fill="#a4acb8" font-family="monospace" font-size="13">VS CODE EXTENSION / V6</text><text x="58" y="169" fill="#f7f7f2" font-size="76" font-weight="700" letter-spacing="-4">your comments</text><text x="58" y="255" fill="#c7ff45" font-size="76" font-weight="700" letter-spacing="-4">got an upgrade.</text><path d="M60 275Q360 258 669 275" fill="none" stroke="#c7ff45" stroke-width="4"/><text x="60" y="340" fill="#a4acb8" font-size="20">code. annotate. actually remember it.</text><g transform="translate(850 130) rotate(8)"><rect width="254" height="146" fill="#c7ff45"/><text x="22" y="44" fill="#0b0d10" font-family="monospace" font-size="16">/* @note</text><text x="22" y="82" fill="#0b0d10" font-size="28" font-weight="700">still your code.</text><text x="22" y="116" fill="#0b0d10" font-family="monospace" font-size="16">just more useful. */</text></g><path d="M1000 327V375M976 351H1024M983 334L1017 368M983 368L1017 334" stroke="#c7ff45" stroke-width="5"/></g></svg>
