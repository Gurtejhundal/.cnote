name: Build VSIX

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
      - 'media/cnote-icon.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnote-vsix-main
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate extension icon
        run: python scripts/generate_icon.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile
        run: npm run compile

      - name: Check generated webview scripts
        run: node scripts/check-webviews.cjs

      - name: Package VSIX
        run: |
          mkdir -p downloads
          cp README.md /tmp/README.github.md
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'<img\b[^>]*\.svg[^>]*>', '', text, flags=re.I)
          p.write_text(text, encoding='utf-8')
          PY
          npx vsce package -o downloads/codenote-6.2.0.vsix
          cp /tmp/README.github.md README.md

      - name: Publish installable VSIX and icon to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- README.md package-lock.json 2>/dev/null || true
          git add -f downloads/codenote-6.2.0.vsix media/cnote-icon.png
          if git diff --cached --quiet; then
            echo "Release assets unchanged"
          else
            git commit -m "Build .cnote 6.2.0 release assets"
            git push
          fi
