name: Build VSIX

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnote-vsix-main
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate extension icon
        run: python scripts/generate_icon.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile
        run: npm run compile

      - name: Check generated webview scripts
        run: node scripts/check-webviews.cjs

      - name: Check Study model
        run: node scripts/check-study-model.cjs

      - name: Check inline note parsing
        run: node scripts/check-inline-notes.cjs

      - name: Check Snap capture logic
        run: node scripts/check-snap-capture.cjs

      - name: Check typing shortcuts
        run: node scripts/check-shortcuts.cjs

      - name: Check package metadata
        run: node scripts/check-package.cjs

      - name: Read package version
        shell: bash
        run: |
          CN_VERSION=$(node -p "require('./package.json').version")
          echo "CN_VERSION=$CN_VERSION" >> "$GITHUB_ENV"

      - name: Package VSIX
        run: |
          mkdir -p downloads
          cp README.md /tmp/README.github.md
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          version = os.environ['CN_VERSION']

          text = re.sub(r'codenote-\d+\.\d+\.\d+\.vsix', f'codenote-{version}.vsix', text)
          text = re.sub(r'\.cnote \d+\.\d+\.\d+', f'.cnote {version}', text)

          old = '<p align="center"><b>UPI support QR is available in the GitHub repo.</b><br><sub>Gurtejbir Singh · A GitHub star is love, too.</sub></p>'
          new = '<p align="center">\n  <img src="https://raw.githubusercontent.com/Gurtejhundal/.cnote/main/assets/crying-waterfall.png" alt="Crying waterfall emoji" width="120"><br>\n  <b>if .cnote saved your brain cells... help me buy a PS5 😭🎮</b><br>\n  <sub>absolutely optional. no paywall. no guilt trip. just the side quest.</sub><br><br>\n  <img src="https://raw.githubusercontent.com/Gurtejhundal/.cnote/main/assets/upi-qr-marketplace.png" alt="UPI QR code for optional .cnote support" width="280"><br>\n  <b>scan with any UPI app</b><br>\n  <sub>Gurtejbir Singh · A GitHub star is love too.</sub>\n</p>'
          text = text.replace(old, new)

          text = re.sub(r'<img\b[^>]*\.svg[^>]*>', '', text, flags=re.I)
          p.write_text(text, encoding='utf-8')
          PY
          npx vsce package -o "downloads/codenote-${CN_VERSION}.vsix"
          cp /tmp/README.github.md README.md

      - name: Publish installable VSIX and icon to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- README.md package-lock.json 2>/dev/null || true
          git add -f "downloads/codenote-${CN_VERSION}.vsix" media/cnote-icon.png
          if git diff --cached --quiet; then
            echo "Release assets unchanged"
          else
            git commit -m "Build .cnote ${CN_VERSION} release assets"
            git push
          fi
