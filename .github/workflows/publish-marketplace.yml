name: Publish VS Code Marketplace

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cnote-marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read package version
        shell: bash
        run: |
          CN_VERSION=$(node -p "require('./package.json').version")
          echo "CN_VERSION=$CN_VERSION" >> "$GITHUB_ENV"

      - name: Verify release VSIX exists
        shell: bash
        run: test -f "downloads/codenote-${CN_VERSION}.vsix"

      - name: Publish with Marketplace Trusted Publishing
        run: npx --yes @vscode/vsce@4.0.0 publish --oidc --skip-duplicate --packagePath "downloads/codenote-${CN_VERSION}.vsix"
