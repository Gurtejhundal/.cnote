name: Build VSIX

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnote-vsix-main
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: |
          mkdir -p downloads
          cp README.md README.github.md
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          # VSCE rejects SVG images referenced from README. Keep the rich GitHub
          # README in the repository, but remove those image tags only while packaging.
          text = re.sub(r'<img\b[^>]*\.svg[^>]*>', '', text, flags=re.I)
          p.write_text(text, encoding='utf-8')
          PY
          npx vsce package -o downloads/codenote-6.0.0.vsix
          mv README.github.md README.md

      - name: Publish installable VSIX to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -f downloads/codenote-6.0.0.vsix
          if git diff --cached --quiet; then
            echo "VSIX unchanged"
          else
            git commit -m "Build .cnote 6.0.0 VSIX"
            git push
          fi
